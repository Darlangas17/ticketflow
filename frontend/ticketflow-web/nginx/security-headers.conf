# Security headers, included in every location: nginx does not inherit add_header into a location
# that declares its own add_header, so a location without this include would send none of them.

# Everything comes from this origin: no CDNs or third parties (fonts are bundled), so no visitor
# data is shared with other sites. Only our own scripts run (no inline scripts, no eval). Styles
# allow 'unsafe-inline' because Angular inserts component styles at runtime.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# No framing (clickjacking), no MIME sniffing, minimal referrer, no access to device features.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Behind HTTPS (production), also send:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
