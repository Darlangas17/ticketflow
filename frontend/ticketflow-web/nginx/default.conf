# Serves the Angular build and proxies /api to the API container, so the browser sees a single
# origin (no CORS needed).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;            # do not reveal the nginx version
    client_max_body_size 1m;      # the API only receives small JSON bodies

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed build files (main-ABC123.js) never change: cache them for a year.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Single-page app: unknown paths return index.html, which is never cached (new deploys apply at once).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
