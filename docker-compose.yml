# TicketFlow: `docker compose up --build` starts the database, the API and the web app.
#   Web app : http://localhost:4200
#   API     : http://localhost:5000   (Swagger: http://localhost:5000/swagger)
#
# LOCAL DEMO SETTINGS. Values can be overridden in a .env file next to this one (see .env.example).
# The SQL Server password default below is for a throwaway local container only, and the database
# port is not published outside Docker. Without JWT_SIGNING_KEY the API generates a random key at
# startup (sessions end when the API restarts). Always set both for any real deployment.

name: ticketflow

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-TicketFlow_Local_Demo_2026!}
    volumes:
      - ticketflow-db:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db,1433;Database=TicketFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD:-TicketFlow_Local_Demo_2026!};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Jwt__GenerateKeyIfMissing: "true"
      Database__MigrateAndSeedOnStartup: "true"
      Swagger__Enabled: "true"
      # Trust X-Forwarded-For only from the Docker network (nginx), so rate limits see the real client IP.
      ForwardedHeaders__KnownNetworks__0: "172.16.0.0/12"
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend/ticketflow-web
    ports:
      - "4200:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ticketflow-db:
